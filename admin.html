<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZayraCartz Admin Panel</title>
  <style>
    body { font-family: sans-serif; background: #FAF8F5; color: #1C1C1C; padding: 15px; margin: 0; }
    .card { background: #FFFFFF; border: 1px solid #C5A880; border-radius: 6px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { font-size: 20px; margin-top: 0; color: #1C1C1C; }
    label { font-size: 12px; font-weight: bold; text-transform: uppercase; display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #CCC; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { background: #1C1C1C; color: white; border: none; padding: 12px; width: 100%; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
    button:hover { background: #C5A880; color: #1C1C1C; }
    .prod-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EEE; padding: 10px 0; }
    .prod-row img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; }
    .del-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; width: auto; margin: 0; }
  </style>
</head>
<body>

  <div class="card" id="authBox">
    <h2>1-Time Admin Setup</h2>
    <p style="font-size: 13px; color: #666;">Ye details sirf aapke phone me save rahengi:</p>
    <label>GitHub Username</label>
    <input type="text" id="ghUser" placeholder="e.g. yourusername">
    <label>Repo Name</label>
    <input type="text" id="ghRepo" placeholder="zayracartz">
    <label>GitHub Personal Token</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxx">
    <button onclick="saveAuth()">Login to Dashboard</button>
  </div>

  <div id="mainDashboard" style="display:none;">
    <div class="card">
      <h2>+ Add New Product</h2>
      <label>Product Title</label>
      <input type="text" id="pTitle" placeholder="e.g. Oversized Graphic T-Shirt">

      <label>Selling Price (₹)</label>
      <input type="number" id="pPrice" placeholder="899">

      <label>Original MRP (₹)</label>
      <input type="number" id="pOriginalPrice" placeholder="1499">

      <label>Product Image (Phone Gallery se choose karein)</label>
      <input type="file" id="pImageFile" accept="image/*">

      <label>Available Sizes (comma separated)</label>
      <input type="text" id="pSizes" value="S, M, L, XL">

      <button id="addBtn" onclick="addProduct()">Upload & Publish Product</button>
      <div id="status" style="font-size: 13px; margin-top: 10px; color: green; font-weight: bold;"></div>
    </div>

    <div class="card">
      <h2>Live Store Products</h2>
      <div id="productsList">Loading products...</div>
    </div>
  </div>

  <script>
    let products = [];
    let currentSha = '';

    window.onload = function() {
      if(localStorage.getItem('gh_token')) {
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        loadProducts();
      }
    };

    function saveAuth() {
      const u = document.getElementById('ghUser').value.trim();
      const r = document.getElementById('ghRepo').value.trim();
      const t = document.getElementById('ghToken').value.trim();
      if(!u || !r || !t) return alert("All fields are required!");
      localStorage.setItem('gh_user', u);
      localStorage.setItem('gh_repo', r);
      localStorage.setItem('gh_token', t);
      location.reload();
    }

    async function loadProducts() {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');
      const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json?t=${Date.now()}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      currentSha = data.sha;
      products = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      renderList();
    }

    function renderList() {
      const box = document.getElementById('productsList');
      if(products.length === 0) { box.innerHTML = '<p>No products yet.</p>'; return; }
      box.innerHTML = products.map((p, i) => `
        <div class="prod-row">
          <img src="${p.image}">
          <div style="flex-grow:1; margin-left: 10px;">
            <div style="font-weight:bold; font-size:14px;">${p.title}</div>
            <div style="font-size:12px; color:#666;">₹${p.price} | Sizes: ${p.sizes.join(', ')}</div>
          </div>
          <button class="del-btn" onclick="deleteProduct(${i})">Delete</button>
        </div>
      `).join('');
    }

    async function addProduct() {
      const title = document.getElementById('pTitle').value.trim();
      const price = parseInt(document.getElementById('pPrice').value);
      const originalPrice = parseInt(document.getElementById('pOriginalPrice').value) || (price + 500);
      const sizes = document.getElementById('pSizes').value.split(',').map(s => s.trim());
      const fileInput = document.getElementById('pImageFile');

      if(!title || isNaN(price) || fileInput.files.length === 0) {
        return alert("Please fill title, price, and select a photo!");
      }

      const btn = document.getElementById('addBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.innerText = "Uploading photo to GitHub...";

      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        const fileName = `img_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;

        const user = localStorage.getItem('gh_user');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');

        // 1. Upload photo to repo images folder
        const imgRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/images/${fileName}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Add product photo", content: base64Data })
        });
        const imgData = await imgRes.json();
        const imageUrl = imgData.content.download_url;

        // 2. Add product to JSON array
        status.innerText = "Saving product to store...";
        products.push({ id: Date.now(), title, price, originalPrice, image: imageUrl, sizes });

        // 3. Update products.json
        const updatedJsonContent = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
        await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Add ${title}`, content: updatedJsonContent, sha: currentSha })
        });

        status.innerText = "Product successfully published!";
        btn.disabled = false;
        document.getElementById('pTitle').value = '';
        document.getElementById('pPrice').value = '';
        fileInput.value = '';
        loadProducts();
      };
    }

    async function deleteProduct(index) {
      if(!confirm("Are you sure you want to remove this product?")) return;
      products.splice(index, 1);
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');
      const updatedJson = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));

      await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: "Delete product", content: updatedJson, sha: currentSha })
      });
      loadProducts();
    }
  </script>
</body>
</html>
